<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Yard Stars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
:root{
  --tile:#1f5c57;--tile-2:#246a64;--wood:#5b3a22;--wood-edge:#3a2414;--table:#e3bf86;--cell:#f6e6c4;--cell-2:#efd9ad;
  --ink:#3b2414;--cream:#fff6e5;--muted:#8a6a4c;--go:#4caf50;--go-d:#2e7d32;--sun:#f5a623;--sun-d:#c77c0a;--sky:#3b8fd9;--sky-d:#2463a0;
  --gold:#f2c94c;--gold-d:#b8860b;--plum:#7a3f8f;--ok:#2e7d32;--bad:#c0392b;
  --display:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--tile);color:var(--ink);font-family:var(--display);font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(45deg,var(--tile-2) 25%,transparent 25%,transparent 75%,var(--tile-2) 75%),linear-gradient(45deg,var(--tile-2) 25%,transparent 25%,transparent 75%,var(--tile-2) 75%);
  background-size:44px 44px;background-position:0 0,22px 22px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.ic{display:inline-grid;place-items:center;line-height:1}
.ic img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.ic>.fb{display:none;font-size:inherit;font-weight:400;line-height:1}
.ic.nf img{display:none}.ic.nf>.fb{display:block}
/* HUD */
.hud{display:flex;gap:6px;align-items:center;background:var(--wood);border:3px solid var(--wood-edge);border-radius:14px;padding:5px 7px;color:var(--cream)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--cream);border:2px solid var(--gold);overflow:hidden;flex:0 0 auto;font-size:20px}
.ava .ic{width:100%;height:100%}
.pill{display:flex;align-items:center;gap:4px;background:var(--wood-edge);border-radius:999px;padding:3px 9px 3px 5px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill .ic{width:18px;height:18px;font-size:15px}
.lvl{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.lvl b{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:var(--wood-edge);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.energy small{font-size:10px;font-weight:500;opacity:.8}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
/* nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--wood);border:3px solid var(--wood-edge);border-bottom:0;border-radius:16px 16px 0 0;padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;color:#e9d6b8;font-size:11px;font-weight:700;padding:4px 0;border-radius:10px;position:relative}
.nav button .e{font-size:21px;line-height:1.1}
.nav button.on{background:var(--wood-edge);color:var(--gold)}
.dot{position:absolute;top:2px;right:18%;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--wood)}
/* kitchen */
.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.order{background:var(--cream);border:3px solid var(--wood-edge);border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0}
.order.story{background:#fff1c7;border-color:var(--gold-d)}
.tag{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.who{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--wood);max-width:100%}
.who .ic{width:22px;height:22px;font-size:17px;border-radius:50%;overflow:hidden;background:var(--cell-2)}
.who>span:not(.ic){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need{display:flex;gap:3px}
.need div{width:30px;height:30px;border-radius:8px;background:var(--cell-2);display:grid;place-items:center;font-size:19px;padding:2px}
.need div .ic{width:100%;height:100%}
.need div.have{background:#cfe9c4;box-shadow:inset 0 0 0 2px var(--ok)}
.give{width:100%;font-size:11px;font-weight:800;color:#fff;background:var(--go);border-bottom:3px solid var(--go-d);border-radius:8px;padding:4px 0}
.give:disabled{background:#b9a78e;border-bottom-color:#8f7d64;color:#f4eadb;cursor:default}
.boardwrap{flex:1;min-height:0;display:grid;place-items:center}
.board{display:grid;grid-template-columns:repeat(6,var(--c));grid-auto-rows:var(--c);gap:4px;padding:7px;background:var(--table);border:4px solid var(--wood);border-radius:16px;box-shadow:0 5px 0 var(--wood-edge);touch-action:none;--c:46px}
.cell{background:var(--cell);border-radius:10px;display:grid;place-items:center;position:relative}
.cell:nth-child(odd){background:var(--cell-2)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--sun)}
.cell.hint{box-shadow:inset 0 0 0 3px var(--go)}
.item{width:88%;height:88%;font-size:calc(var(--c)*.6);display:grid;place-items:center;position:relative}
.item .ic{width:100%;height:100%}
.item .lv{position:absolute;right:-2px;bottom:-3px;font-size:10px;font-weight:800;color:var(--wood);background:rgba(255,255,255,.85);border-radius:6px;padding:0 4px}
.item.sp{filter:drop-shadow(0 0 4px var(--gold))}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ghost{position:fixed;pointer-events:none;z-index:50;width:52px;height:52px;font-size:40px;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.ghost .ic{width:100%;height:100%}
.shelf{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.gen{flex:1 0 64px;background:var(--cream);border:3px solid var(--wood);border-bottom-width:5px;border-radius:12px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.gen .ic{width:34px;height:34px;font-size:24px}
.gen b{font-size:10px;font-weight:700;color:var(--wood);white-space:nowrap}
.gen small{font-size:9px;color:var(--muted)}
.gen.lock{opacity:.45;border-style:dashed}
.gen:active:not(.lock){transform:translateY(2px);border-bottom-width:3px}
/* home */
.room{position:relative;flex:1;min-height:0;border:4px solid var(--wood);border-radius:16px;overflow:hidden;background:linear-gradient(#8f9a88 0 55%,#7a5a3c 55% 100%)}
.room.nice{background:linear-gradient(#f4e2c4 0 55%,#c88a4e 55% 100%)}
.room>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.room>.bg.nf{display:none}
.fur{position:absolute;transform:translate(-50%,-100%)}
.fur .ic{display:grid;width:100%;aspect-ratio:1;font-size:min(13vw,60px)}
.fur.newly{animation:pop .6s ease-out}
.fur.flat{transform:translate(-50%,-100%) scaleY(.5);transform-origin:50% 100%}
.hero-in-room{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.hero-in-room .ic{display:grid;width:100%;aspect-ratio:4/5;font-size:min(16vw,70px);filter:drop-shadow(0 5px 4px rgba(0,0,0,.3))}
.hero-in-room>span:not(.ic){font-size:10px;font-weight:800;color:#fff;background:rgba(58,36,20,.75);border-radius:6px;padding:1px 6px;white-space:nowrap}
.roombar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}
.roombar .back{flex:0 0 auto;padding:0 12px}
/* картинки мебели обрезаны по самому предмету: стоят на своей нижней точке, без пустых полей */
.room .fur .ic{display:block;aspect-ratio:auto;filter:drop-shadow(0 5px 4px rgba(0,0,0,.28))}.room .fur .ic img{height:auto}.room .fur .ic.nf{display:grid;aspect-ratio:1}
.room.outdoor{background:linear-gradient(#bfe3f0 0 30%,#9cc777 30% 100%)}
.ptitle{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(58,36,20,.8);color:#fff4dc;font-weight:800;font-size:14px;padding:4px 12px;border-radius:12px;white-space:nowrap}
.street{gap:8px;overflow:auto}
.spot{display:flex;gap:10px;align-items:center;text-align:left;background:#fff8ea;border:3px solid var(--line,#e9d2a8);border-radius:16px;padding:8px;width:100%}
.spot .ic{width:84px;height:62px;flex:0 0 auto;font-size:40px}
.spot .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.spot .tx b{font-size:15px;color:var(--wood)}.spot .tx span{font-size:12px;color:#8a6a4a}
.spot .bar{background:var(--cell-2)}.spot .bar i{background:var(--go)}
.spot.locked{opacity:.55;filter:grayscale(.6)}
.cozy{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,246,229,.92);border:2px solid var(--wood);border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--wood)}
.cozy .bar{flex:1;background:var(--cell-2)}.cozy .bar i{background:var(--go)}
.btn{color:#fff;font-weight:800;font-size:14px;border-radius:14px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1}
.b-go{background:var(--go);border-bottom:5px solid var(--go-d)}
.b-sun{background:var(--sun);border-bottom:5px solid var(--sun-d);color:var(--ink)}
.b-sky{background:var(--sky);border-bottom:5px solid var(--sky-d)}
.b-wood{background:var(--wood);border-bottom:5px solid var(--wood-edge);color:var(--cream)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:#b9a78e;border-bottom-color:#8f7d64;color:#f4eadb}
/* panels */
.panel{flex:1;min-height:0;overflow:auto;background:var(--cream);border:4px solid var(--wood);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:20px;font-weight:800;color:var(--wood);text-wrap:balance}
.panel p,.sheet p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--cell-2);border-radius:12px;padding:9px}
.row>.ic{width:40px;height:40px;font-size:28px;flex:0 0 auto}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;color:var(--ink)}
.row .tx span{font-size:12px;color:var(--muted)}
.mini.soft{opacity:.6}.mini{font-weight:800;font-size:13px;color:#fff;border-radius:10px;padding:8px 12px;background:var(--go);border-bottom:3px solid var(--go-d);white-space:nowrap}
.mini.star{background:var(--sun);border-bottom-color:var(--sun-d);color:var(--ink)}
.mini:disabled{background:#b9a78e;border-bottom-color:#8f7d64}
.mini.done{background:transparent;color:var(--ok);border:0}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:#fff;border:3px solid var(--cell-2);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.sil .ic img{filter:brightness(0) opacity(.45)}.sil .ic .fb{filter:brightness(0) opacity(.3)}
.pill .jarb{font-style:normal;font-size:11px;margin-left:4px;opacity:.85}
button.pill{border:0;font:inherit;color:inherit;cursor:pointer}
.stars{font-style:normal;color:#f5a623;letter-spacing:-1px}
.ci{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain}
.card.pick{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.card.locked{opacity:.55}
.card .ic{width:100%;aspect-ratio:1;font-size:44px}
.card b{font-size:14px;color:var(--ink)}
.card>span:not(.ic){font-size:11px;color:var(--muted)}
.big .ic{display:grid;width:100%;aspect-ratio:1;font-size:72px}
.rar-1{border-color:#9ccc65}.rar-2{border-color:#64b5f6}.rar-3{border-color:#ba68c8}.rar-4{border-color:#ffb300}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--cell-2);font-weight:800;color:var(--wood);font-size:13px}.tabs button.on{background:var(--wood);color:var(--cream)}
.team{background:#fff;border:3px solid var(--cell-2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}.team.locked{opacity:.75}
.thead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.thead b{color:var(--wood);font-size:15px}.thead span{flex:1;font-size:11px;color:var(--muted);min-width:0}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.slot{aspect-ratio:1;border-radius:12px;background:var(--cell);border:2px solid var(--cell-2);display:grid;place-items:center;position:relative;font-size:22px;color:var(--muted);font-weight:800}
.slot .ic{width:92%;height:92%;font-size:26px}.slot i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:13px;background:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--cell-2)}
.slot.empty{border-style:dashed}.slot.lock{background:#eee3cf}
.g3{grid-template-columns:repeat(3,1fr)}
.rtag{display:inline-block;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;vertical-align:middle}
.sub{font-size:14px;color:var(--wood);display:block}
.coach{position:fixed;inset:0;z-index:90}
.coach .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,12,6,.68);transition:all .25s;pointer-events:none;outline:3px solid #ffd76a}
.coach .tip{position:fixed;left:12px;right:12px;max-width:480px;margin:0 auto;background:var(--cream);border:4px solid var(--wood);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.coach .tip .ic{width:52px;height:52px;flex:0 0 auto;font-size:36px}
.coach .tip b{display:block;color:var(--wood);font-size:15px;margin-bottom:3px}.coach .tip p{margin:0;font-size:14px;line-height:1.4;color:var(--ink)}
.coach .tip small{display:block;margin-top:6px;color:var(--muted);font-weight:700;font-size:12px}
.mtop{border-radius:14px;background:linear-gradient(160deg,#5fae4f,#2f7a3a);border:3px solid var(--wood);padding:8px 10px 10px;color:#fff;display:flex;flex-direction:column;gap:8px}
.mtop .tm{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.mtrack{position:relative;height:58px;margin:0 6px}
.mtrack .ln{position:absolute;left:0;right:0;top:20px;height:10px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden}.mtrack .ln i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ffe27a,#f5a623)}
.mtrack .bx{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:0}
.mtrack .bx .ic{width:40px;height:40px;font-size:28px;filter:grayscale(.6) brightness(.9)}.mtrack .bx.can .ic{filter:none;animation:pulse 1s infinite}.mtrack .bx.got .ic{filter:grayscale(1) opacity(.5)}
.mtrack .bx b{font-size:11px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.mpts{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:12px;background:#2d5fa8;border:3px solid #fff;font-weight:800;font-size:16px;color:#fff}
.mrow{background:#fff;border:2px solid var(--cell-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.mrow .mh{display:flex;align-items:center;gap:8px}.mrow .mh b{flex:1;color:var(--wood);font-size:14px}.mrow .mh small{font-weight:800;color:var(--muted);font-size:12px}
.mrow .mb{display:flex;align-items:center;gap:6px}.mrow .rws{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.rw{position:relative;width:38px;height:38px;border-radius:9px;background:linear-gradient(160deg,#c48af0,#7e3fb8);display:grid;place-items:center;font-size:20px;border:2px solid var(--wood)}
.rw .ic{width:28px;height:28px;font-size:20px}.rw i{position:absolute;right:-3px;bottom:-5px;font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--wood);border-radius:6px;padding:0 3px}
.rw.pts{background:linear-gradient(160deg,#7fc4ff,#2f78c9)}
.mbtn{min-width:78px;font-weight:800;font-size:13px;color:#fff;border-radius:10px;padding:8px 10px;background:var(--sky);border-bottom:3px solid var(--sky-d)}
.mbtn.go{background:var(--go);border-bottom-color:var(--go-d)}.mstamp{min-width:78px;text-align:center;font-weight:800;color:#b9a27e;border:2px dashed #d8c39c;border-radius:10px;padding:6px;transform:rotate(-6deg);font-size:12px}
.mrow .mbar{height:6px;border-radius:999px;background:#eadbc0;overflow:hidden}.mrow .mbar i{display:block;height:100%;background:var(--go)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.namebox{display:flex;gap:6px}.namebox input{flex:1;min-width:0;border:2px solid var(--cell-2);border-radius:10px;padding:8px;font:inherit;font-weight:700;color:var(--ink);background:#fff}
.sbanner{position:relative;min-height:118px;border-radius:14px;overflow:hidden;background:linear-gradient(120deg,#ffcf6b,#f08a3c 60%,#b8562a);border:3px solid var(--wood);display:flex;align-items:flex-end;padding:10px}
.sbanner .ic{position:absolute;right:4px;bottom:-6px;width:128px;height:150px;font-size:80px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.sbanner h2{position:absolute;left:12px;top:8px;color:#fff!important;text-shadow:0 2px 0 rgba(58,36,20,.6)}
.sbanner .wal{display:flex;gap:6px;position:relative}.sbanner .wal span{background:rgba(58,36,20,.78);color:#fff;font-weight:800;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;font-size:14px}.sbanner .wal .ic{position:static;width:18px;height:18px;font-size:14px;filter:none}
.stimer{text-align:center;background:var(--cell-2);color:var(--wood);font-weight:800;border-radius:10px;padding:6px;font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scard{background:#fff;border:3px solid var(--cell-2);border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.scard b{font-size:12px;line-height:1.15;color:var(--wood);min-height:28px;display:flex;align-items:center}
.scard .box{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(160deg,#c9a26b,#8b5a2b);border:3px solid var(--wood);position:relative}
.scard .box.p{background:linear-gradient(160deg,#c48af0,#7e3fb8)}.scard .box.b{background:linear-gradient(160deg,#7fc4ff,#2f78c9)}.scard .box.g{background:linear-gradient(160deg,#ffd76a,#e09a1c)}
.scard .box .ic{width:52px;height:52px;font-size:36px}.scard .box i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-weight:800;font-size:11px;color:#fff;background:var(--wood);border-radius:8px;padding:0 5px}
.scard small{font-size:11px;color:var(--muted);font-weight:700}
.scard .pb{width:100%;background:var(--sky);border-bottom:4px solid var(--sky-d);color:#fff;font-weight:800;border-radius:10px;padding:6px 2px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:3px}
.scard .pb.star{background:var(--sun);border-bottom-color:var(--sun-d);color:var(--ink)}
.scard .pb .ic{width:16px;height:16px;font-size:13px}
.scard.out{opacity:.55}.scard.out .pb{background:#9aa;border-bottom-color:#788}
.ebox{background:#fff;border:2px solid var(--cell-2);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.ebox .big{font-size:40px;width:56px;height:56px;border-radius:12px;background:linear-gradient(160deg,#7fc4ff,#2f78c9);display:grid;place-items:center;border:3px solid var(--wood)}
.ebox .tx{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--wood);font-weight:700}

async function save(keepalive){
  if(DEMO || !dirty || !S) return; if(saving){ clearTimeout(saveT); saveT=setTimeout(save,1000); return; }
  saving = true; dirty = false;
  const sent = JSON.parse(JSON.stringify(S)); sentSnap = sent;

    const r = await api('/api/save', { rev: REV, state: sent }, keepalive);
    if(r._status===200 && r.ok){ REV = r.rev; applyFix(sent, r.fix); }
    else if(r._status===409 && r.state){ REV = r.rev; S = r.state; normalize(); render(); toast('Прогресс обновлён с сервера'); }

function applyFix(sent, fix){
  if(!fix) return;
  if(fix.coins < sent.coins) S.coins = Math.max(0, S.coins - (sent.coins - fix.coins));
  if(fix.energy < sent.energy) S.energy = Math.max(0, S.energy - (sent.energy - fix.energy));
  if(fix.level !== sent.level && fix.level < S.level) S.level = fix.level;
  for(const id in fix.upg){ if(JSON.stringify(S.upg[id])===JSON.stringify(sent.upg[id])) S.upg[id] = fix.upg[id]; }
  for(const id in S.upg){ if(!fix.upg[id] && JSON.stringify(S.upg[id])===JSON.stringify(sent.upg[id])) delete S.upg[id]; }
  for(const h in S.heroes){ if(!fix.heroes[h] && sent.heroes[h]) delete S.heroes[h]; }
  for(const h in fix.heroes){ if(!S.heroes[h]) S.heroes[h] = fix.heroes[h]; }
  const d = (a,b) => (Number(a)||0) - (Number(b)||0);
  if(fix.tok!==undefined && fix.tok!==sent.tok) S.tok = Math.max(0, (S.tok||0) + d(fix.tok, sent.tok));
  if(fix.mis && sent.mis && (fix.mis.d!==sent.mis.d || fix.mis.w!==sent.mis.w)){ S.mis = fix.mis; }
  if(fix.jars!==undefined && fix.jars!==sent.jars) S.jars = Math.max(0, (S.jars||0) + d(fix.jars, sent.jars));
  if(fix.freeLeft!==undefined) S.freeLeft = Math.max(0, (S.freeLeft ?? fix.freeLeft) + d(fix.freeLeft, sent.freeLeft ?? fix.freeLeft)); else delete S.freeLeft;
  if(fix.dshop){ S.dshop = S.dshop||{}; for(const k in fix.dshop) S.dshop[k] = Math.max(0, (S.dshop[k] ?? fix.dshop[k]) + d(fix.dshop[k], (sent.dshop||{})[k] ?? fix.dshop[k])); }
  if(fix.wshop){ if(!S.wshop || S.wshop.week!==fix.wshop.week) S.wshop = fix.wshop; else for(const h in fix.wshop.left) S.wshop.left[h] = Math.max(0, (S.wshop.left[h] ?? fix.wshop.left[h]) + d(fix.wshop.left[h], ((sent.wshop||{}).left||{})[h] ?? fix.wshop.left[h])); }
  render(); if(kind) redraw();
}

function ensureMis(){
  if(!S) return; const d = misDay(), w = misWeek(); const m = S.mis = S.mis || {};
  if(m.w !== w){ m.w = w; m.wc = {}; m.wok = []; m.wbx = []; }
  if(m.d !== d){ m.d = d; m.c = {login:1}; m.ok = []; m.bx = []; m.wc = m.wc||{}; m.wc.login = (m.wc.login||0) + 1; markDirty(); }
  m.c = m.c||{}; m.ok = m.ok||[]; m.bx = m.bx||[]; m.wc = m.wc||{}; m.wok = m.wok||[]; m.wbx = m.wbx||[];
}
function mc(k, n){ if(!S) return; ensureMis(); n = n||1; if(MISSIONS.day[k]) S.mis.c[k] = (S.mis.c[k]||0) + n; if(MISSIONS.week[k] && k!=='login') S.mis.wc[k] = (S.mis.wc[k]||0) + n; }
const misSide = kind => kind==='day' ? {c:S.mis.c, ok:S.mis.ok, bx:S.mis.bx} : {c:S.mis.wc, ok:S.mis.wok, bx:S.mis.wbx};
const misPts = kind => { const M = MISSIONS[kind], x = misSide(kind); return x.ok.reduce((a,id)=>a+(M[id]?M[id].pts:0),0); };
function misReady(){ if(!S || !S.mis) return 0; let n = 0; for(const kind of ['day','week']){ const M = MISSIONS[kind], x = misSide(kind);
  for(const id in M) if(!x.ok.includes(id) && (x.c[id]||0) >= M[id].need) n++;
  MISSION_BOXES[kind].forEach((b,i) => { if(!x.bx.includes(i) && misPts(kind) >= b.at) n++; }); } return n; }

  if(g.tok){ S.tok = (S.tok||0) + g.tok; got.push('🎫 '+g.tok); }

function rewChips(g){ const a = []; if(g.tok) a.push(`<span class="rw">🎫<i>${g.tok}</i></span>`); if(g.jars) a.push(`<span class="rw">${ic('sp/jar','🥫')}<i>${g.jars}</i></span>`);

function normalize(){

  S.goals = S.goals||{picked:[],day:'',done:{},week:-1}; S.wardrobe = S.wardrobe||{owned:[],wear:{}}; S.stats = S.stats||{orders:0,merges:0};
  S.shards = S.shards||{}; S.gear = S.gear||{};

  for(const h of Object.keys(S.heroes)){ const H = S.heroes[h]; if(H.look && H.look!=='auto' && isHair(h,H.look)){ H.hair = H.look; H.look = 'auto'; } }

  S.teams = S.teams.map((t,i) => (Array.isArray(t)?t:[]).filter(h => ownsHero(h)).slice(0, TEAM_SIZE));

function placeChests(){

  while(n > 0){ const i = place({sp:'chest'}); if(i<0) break; S.chestsTaken=(S.chestsTaken||0)+1; n--; placed++; }

}

const SHARD_LEVELS = 4;   // не больше одного героя из осколков на каждые 4 уровня (так же считает сервер)
const shardRoom = () => Math.floor(S.level/SHARD_LEVELS) - ownedHeroes().filter(h => !STARTERS.includes(h) && !(S.paidHeroes||[]).includes(h)).length;
function addShard(h, n){

// заказы приходят от ВСЕХ персонажей игры; герои из команды — примерно в половине заказов, чтобы они росли в уровне
function orderHero(){
  const team = teamHeroes(), others = HERO_IDS.filter(h => !team.includes(h) && HEROES[h].fav.some(lineOpen));
  if(!others.length || (team.length && Math.random() < .5)) return team.length ? pick(team) : null;
  return pick(others);
}
function mkOrder(force){
  const hi = force && HEROES[force] ? force : orderHero(); if(!hi) return null; const h = HEROES[hi];
  const favs = h.fav.filter(lineOpen);
  const maxL = Math.min(4, 1+Math.floor((S.level+1)/2));
  const cnt = S.level>=3 && Math.random()<.45 ? 2 : 1;
  const items = []; for(let k=0;k<cnt;k++) items.push({c:pick(favs.length?favs:['b']), l:Math.max(1, Math.min(maxL, 1+rnd(maxL)))});
  return { hero:hi, items, reward: items.reduce((a,x)=>a+5*Math.pow(2,x.l),0) };
}
function mkStory(){
  const avail = teamHeroes().filter(h => !(S.story[h]&&S.story[h].done) && HEROES[h].story.steps.flat().every(([c]) => lineOpen(c)));
  if(!avail.length) return mkOrder();
  const h = avail[0], st = S.story[h] || (S.story[h] = {step:0}); const s = HEROES[h].story;
  return { hero:h, story:true, items: s.steps[st.step].map(([c,l])=>({c,l})), reward: 20+st.step*15 };
}
function ensureOrders(){
  const n = orderSlots(); S.orders = S.orders.slice(0, n);
  if(!S.orders[0] || !S.orders[0].story){ const s = mkStory(); if(s && s.story) S.orders[0] = s; }
  for(let k=0;k<n;k++) if(!S.orders[k]) S.orders[k] = mkOrder();
}
function lineShare(o, lines){ return o.items.filter(x => lines.includes(x.c)).length / Math.max(1, o.items.length); }
const payOf = o => Math.round(o.reward * (1 + heroBonus(o.hero) + placesDone()*PLACE_BONUS + skill('coins') + skill('line_f')*lineShare(o,['f']) + skill('line_bd')*lineShare(o,['b','d']) + skill('line_g')*lineShare(o,['g'])));
function matchIdx(o){ const used = new Set(); return o.items.map(x => { const i = S.board.findIndex((b,j)=>b&&!b.sp&&!used.has(j)&&b.c===x.c&&b.l===x.l); if(i>=0) used.add(i); return i; }); }
function give(k){
  const o = S.orders[k]; const m = matchIdx(o); if(!m.every(i=>i>=0)) return;
  const kept = Math.random() < skill('keep');
  if(!kept) m.forEach(i => S.board[i]=null);
  const pay = payOf(o);
  S.coins += pay; addXp(Math.round(o.reward/3 * (1 + skill('xp')))); S.stats.orders++; mc('orders');
  if(kept) setTimeout(() => toast('🥊 Тайский боец: продукты остались на поле!'), 1300);
  const H = S.heroes[o.hero], h = HEROES[o.hero];
  if(H) H.xp = (H.xp||0)+1;
  if(H && H.xp >= heroNeed(H.lv) && H.lv < CONFIG.HERO_MAX_LEVEL){ H.xp = 0; H.lv++; mc('herolv'); S.coins += CONFIG.HERO_LEVEL_COINS + 10*H.lv;
    const hid = o.hero, news = [];
    if(hid){ if(hairList(hid).some(x => hairLevel(hid,x[0])===H.lv)) news.push('новая внешность'); if(costumeList(hid).some(x => costumeLevel(hid,x[0])===H.lv)) news.push('секретный костюм'); }
    toast(h.e+' '+hn(o.hero)+' — уровень '+H.lv+'! +'+(CONFIG.HERO_LEVEL_COINS + 10*H.lv)+' 🪙'+(news.length?'\n🔓 Открыто: '+news.join(' и '):''), 3600); }
  if(o.story){
    const st = S.story[o.hero], s = h.story; st.step++;
    if(st.step >= s.steps.length){ st.done = true; const sc = Math.round(s.coins * (1 + skill('story'))); S.coins += sc; const j = place({sp:s.prize}); if(j>=0) popAt.add(j);
      const sh = randomShardHero(); if(sh) addShard(sh, 2);
      toast('🏆 '+s.name+' — готово!\n+'+sc+' 🪙 и '+SP[s.prize][0]+' в подарок'+(sh?'\n+2 осколка: '+HEROES[sh].e+' '+hn(sh):''), 4200); S.orders[k] = mkStory(); }
    else { toast(h.e+' '+hn(o.hero)+': отлично! Шаг '+st.step+' из '+s.steps.length); S.orders[k] = mkStory(); }
  } else { toast(h.e+' '+hn(o.hero)+': спасибо! +'+pay+' 🪙'); S.orders[k] = mkOrder(); }
  haptic('ok'); tutStep(2); markDirty(); render();
}

/* ---------- поле ---------- */
let selected = null, popAt = new Set();
const empties = () => S.board.map((b,i)=>b?-1:i).filter(i=>i>=0);
function place(obj){ const e = empties(); if(!e.length) return -1; const i = pick(e); S.board[i] = obj; return i; }
const itemOf = b => b.sp ? SP[b.sp] : LINES[b.c].it[b.l];
// разная цена энергии, как в TopHeroes: удочка дороже, генератор 3-го уровня ещё +1
const energyCost = c => (c==='f' ? 2 : 1) + ((S.gen[c]||1) >= 3 ? 1 : 0);
// корзина Шефа: сразу 3 продукта 2-го уровня за 5 энергии
function basket(){
  tickEnergy(); if(S.energy < 5){ openSheet('energy'); return; }
  if(empties().length < 3){ toast('Нужно 3 свободные клетки — соедини продукты'); return; }
  if(S.energy >= CONFIG.ENERGY_MAX) S.eTs = now();
  S.energy -= 5; mc('gens'); const pool = LINE_ORDER.filter(lineOpen);
  for(let k=0;k<3;k++){ const i = place({c:pick(pool), l:1}); popAt.add(i); }
  haptic('medium'); toast('🧺 Корзина Шефа: 3 продукта!'); markDirty(); renderKitchen();
}
function spawnFrom(c){
  if(!lineOpen(c)){ toast('Удочка откроется на 4-м уровне'); return; }
  tickEnergy();
  const cost = energyCost(c);
  if(S.energy < cost){ openSheet('energy'); return; }
  if(!empties().length){ toast('Нет места — соедини одинаковые продукты'); return; }
  if(S.energy >= CONFIG.ENERGY_MAX) S.eTs = now();
  if(Math.random() >= skill('refund')) S.energy -= cost; mc('gens');
  const r = Math.random()*100, sp = CONFIG.SPECIAL, ch = sp.chest + skill('chest'); let obj;
  if(r < ch) obj = {sp:'chest'}; else if(r < ch+sp.joker) obj = {sp:'joker'}; else if(r < ch+sp.joker+sp.scis) obj = {sp:'scis'};
  else { const odds = CONFIG.GEN_ODDS[(S.gen[c]||1)-1], x = Math.random()*100; obj = {c, l: x<odds[0]?0 : x<odds[0]+odds[1]?1:2};
    if(obj.l < 4 && Math.random() < skill('upspawn')) obj.l++; }
  const i = place(obj); popAt.add(i); haptic('light');
  if(obj.sp) toast(SP[obj.sp][0]+' '+SP[obj.sp][1]);
  tutStep(0); markDirty(); renderKitchen();
}
function openChest(i){
  S.board[i] = null; mc('chests');
  const pool = LINE_ORDER.filter(lineOpen); const n = 2+rnd(2); const got = [];
  for(let k=0;k<n;k++){ const obj = {c:pick(pool), l:rnd(2)}; const j = place(obj); if(j>=0){ popAt.add(j); got.push(LINES[obj.c].it[obj.l][0]); } }
  const coins = 10+rnd(21); S.coins += coins; haptic('ok');
  let extra = ''; if(Math.random() < CONFIG.SHARD_CHANCE + skill('shard')){ const sh = randomShardHero(); if(sh){ addShard(sh, 1); extra = '\n+1 осколок: '+HEROES[sh].e+' '+hn(sh)+' ('+((S.shards[sh]||0)||'герой!')+(S.shards[sh]?'/'+shardNeed(sh):'')+')'; } }
  toast('🎁 В сундуке: '+got.join(' ')+' и '+coins+' 🪙'+extra, extra?3600:2400); markDirty();
}
function drop(from, to){
  if(from===to) return;
  const a = S.board[from], b = S.board[to]; if(!a) return;
  if(a.sp==='joker' && b && !b.sp){ if(b.l>=4){ toast('Это уже лучшее блюдо'); return; } S.board[to]={c:b.c,l:b.l+1}; S.board[from]=null; popAt.add(to); addXp(b.l+1); markDirty(); return; }
  if(a.sp==='scis' && b && !b.sp){ if(b.l<1){ toast('Нужен продукт уровня 2 и выше'); return; } S.board[to]={c:b.c,l:b.l-1}; S.board[from]={c:b.c,l:b.l-1}; popAt.add(to); popAt.add(from); markDirty(); return; }
  if(b && !a.sp && !b.sp && b.c===a.c && b.l===a.l){
    if(a.l>=4){ toast('Это уже лучшее блюдо!'); return; }
    S.board[to]={c:a.c,l:a.l+1}; S.board[from]=null; popAt.add(to); addXp(a.l+1); S.stats.merges++; mc('merges'); haptic('medium');
    if(a.l+1===4) toast('✨ Новое блюдо: '+LINES[a.c].it[4][1]+'!');
    tutStep(1);
  } else { S.board[to]=a; S.board[from]=b; }
  markDirty();
}

function kitchenHtml(){

let boardEl = null;
function mountKitchen(){
  boardEl = $('board');

function sizeBoard(){
  const bw = $('bw'); if(!bw || !boardEl) return;
  const w = bw.clientWidth-22, h = bw.clientHeight-26;

}
function renderKitchen(){
  if(view!=='kitchen' || !boardEl) return;
  $('coins').textContent = S.coins; $('en').textContent = S.energy;
  const oEl = $('orders');
  oEl.innerHTML = S.orders.map((o,k) => {

  }).join('');
  const hint = new Set(), s = selected!=null ? S.board[selected] : null;
  if(s) S.board.forEach((b,i)=>{ if(i===selected||!b) return;
    if(!s.sp && !b.sp && b.c===s.c && b.l===s.l && s.l<4) hint.add(i);
    if(s.sp==='joker' && !b.sp && b.l<4) hint.add(i);
    if(s.sp==='scis' && !b.sp && b.l>=1) hint.add(i); });
  [...boardEl.children].forEach((cell,i)=>{
    const b = S.board[i];
    cell.className = 'cell'+(i===selected?' sel':'')+(hint.has(i)?' hint':'');
    if(!b){ cell.innerHTML=''; return; }
    const inner = b.sp ? spIc(b.sp) : itemIc(b.c,b.l)+`<span class="lv">${b.l+1}</span>`;
    cell.innerHTML = `<div class="item${b.sp?' sp':''}${popAt.has(i)?' pop':''}" title="${esc(itemOf(b)[1])}">${inner}</div>`;
  });

    return `<button class="gen${u?'':' lock'}" data-c="${c}" aria-label="${L.gen}">${u?ic('gen/'+c, L.ge):'<span class="ic">🔒</span>'}<b>${L.gen}</b><small>${u?('ур. '+gl+' · '+energyCost(c)+'⚡'):'с Котом'}</small></button>`; }).join('')
    + `<button class="gen basket" data-basket aria-label="Корзина Шефа">${ic('sp/chest','🧺')}<b>Корзина</b><small>3 продукта · 5⚡</small></button>`;
}
let drag = null;
function bindBoard(){
  boardEl.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.cell'); if(!cell) return;
    drag = { i:+cell.dataset.i, x:e.clientX, y:e.clientY, ghost:null, has:!!S.board[+cell.dataset.i] };
    boardEl.setPointerCapture(e.pointerId);
  });
  boardEl.addEventListener('pointermove', e => {
    if(!drag || !drag.has) return;
    if(!drag.ghost && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 8){
      const b = S.board[drag.i]; const g = document.createElement('div'); g.className='ghost';
      g.innerHTML = b.sp ? spIc(b.sp) : itemIc(b.c,b.l); document.body.appendChild(g); drag.ghost = g;
      selected = drag.i; renderKitchen(); const it = boardEl.children[drag.i].firstChild; if(it) it.style.opacity='.25';
    }
    if(drag.ghost){ drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px'; }
  });
  boardEl.addEventListener('pointerup', e => {
    if(!drag) return; const d = drag; drag = null;
    if(d.ghost){ d.ghost.remove(); const el = document.elementFromPoint(e.clientX,e.clientY); const cell = el && el.closest && el.closest('.cell');
      if(cell) drop(d.i, +cell.dataset.i); selected = null; renderKitchen(); return; }
    const b = S.board[d.i];
    if(selected==null && b && b.sp==='chest'){ openChest(d.i); renderKitchen(); return; }
    if(selected!=null && selected!==d.i){ drop(selected, d.i); selected = null; }
    else if(b && selected!==d.i){ selected = d.i; if(b.sp) toast(SP[b.sp][0]+' '+SP[b.sp][1]); }
    else selected = null;
    renderKitchen();
  });
  boardEl.addEventListener('pointercancel', () => { if(drag && drag.ghost) drag.ghost.remove(); drag = null; selected = null; renderKitchen(); });
}

let taskTab = 'day';

  const tabs = `<div class="tabs"><button class="${taskTab==='day'?'on':''}" data-ttab="day">Дневные</button><button class="${taskTab==='week'?'on':''}" data-ttab="week">Недельные</button><button class="${taskTab==='mine'?'on':''}" data-ttab="mine">Цели для себя</button></div>`;

function missionsHtml(kind){
  ensureMis();
  const M = MISSIONS[kind], B = MISSION_BOXES[kind], x = misSide(kind), pts = misPts(kind), max = B[B.length-1].at;
  const reset = kind==='day' ? nextMisReset() : nextMisWeek();
  // сундуки стоят на шкале через равные промежутки, заполнение идёт по участкам между ними
  const pos = i => (i+1)/B.length*100;
  let fill = 0; for(let i=0;i<B.length;i++){ const lo = i ? B[i-1].at : 0, a = i ? pos(i-1) : 0; if(pts >= B[i].at) fill = pos(i); else { fill = a + (pos(i)-a) * Math.max(0, pts-lo)/(B[i].at-lo); break; } }
  const boxes = B.map((b,i) => { const got = x.bx.includes(i), can = !got && pts >= b.at;
    return `<button class="bx${got?' got':can?' can':''}" style="left:${pos(i)-6}%" data-mbox="${kind}:${i}">${ic('sp/chest','🎁')}<b>${b.at}</b></button>`; }).join('');
  const order = Object.keys(M).sort((a,b) => { const st = id => x.ok.includes(id) ? 2 : (x.c[id]||0) >= M[id].need ? 0 : 1; return st(a)-st(b); });
  const rows = order.map(id => { const m = M[id], have = Math.min(m.need, x.c[id]||0), done = x.ok.includes(id), ready = !done && have >= m.need, T = MIS_TEXT[id];
    const btn = done ? '<span class="mstamp">Собрано</span>' : ready ? `<button class="mbtn go" data-mclaim="${kind}:${id}">Забрать</button>` : T[1] ? `<button class="mbtn" data-mgo="${T[1]}">Идти</button>` : '';
    return `<div class="mrow"><div class="mh"><b>${T[0](m.need)}</b><small>${have}/${m.need}</small></div><div class="mbar"><i style="width:${have/m.need*100}%"></i></div>
      <div class="mb"><div class="rws"><span class="rw pts">⭐<i>${m.pts}</i></span>${rewChips(m.give)}</div>${btn}</div></div>`; }).join('');
  return `<div class="mtop"><div class="tm"><span>${kind==='day'?'Миссии дня':'Миссии недели'}</span><span>Сброс через <i data-cd2="${reset}">${fmtClock((reset-now())/1000)}</i></span></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="mpts">${pts}</span><div class="mtrack" style="flex:1"><div class="ln"><i style="width:${Math.min(100,fill)}%"></i></div>${boxes}</div></div></div>
    <p style="font-size:12px">Выполняй миссии — получай очки ⭐ и открывай сундуки на шкале. Награды: 🎫 жетоны соседа (на них — Лавка жетонов в магазине), банки, монеты. Сброс ${kind==='day'?'каждый день в 7:00':'по понедельникам в 7:00'}.</p>${rows}`;
}

async function buy(sku){

    if(k==='chest' && !empties().length){ toast('Нет места на кухне — освободи клетку для сундука'); return; }
    let msg = ''; if(k==='shard'){ const h = randomShardHero(); if(!h){ toast('Все герои уже собраны'); return; } addShard(h,1); msg = '🧩 Осколок: '+hn(h); }
    S.tok -= it.t; if(k==='jar'){ S.jars = (S.jars||0)+1; msg = '🥫 +1 банка'; } if(k==='jars5'){ S.jars = (S.jars||0)+5; msg = '🥫 +5 банок'; } if(k==='chest'){ place({sp:'chest'}); msg = '🎁 Сундук на кухне!'; }
    mc('shop'); haptic('ok'); toast(msg); markDirty(); save(); render(); return; }
  if(ds.hname!=null){ const h = ds.hname, inp = document.getElementById('hname'); if(!inp || !S.heroes[h]) return; const v = inp.value.replace(/[<>\n\r\t]/g,'').trim().slice(0,16);
    if(v) S.heroes[h].name = v; else delete S.heroes[h].name; haptic('ok'); toast(v ? 'Теперь это '+v+'!' : 'Имя убрано'); markDirty(); redraw(); render(); return; }
  if(ds.shopgo){ closeSheet(); view = 'shop'; shopTab = ds.shopgo; render(); return; }
  if(ds.free!=null){ if((S.freeLeft||0) > 0){ tickEnergy(); S.freeLeft--; S.energy += CONFIG.FREE_ENERGY; haptic('ok'); toast('🎁 +'+CONFIG.FREE_ENERGY+' ⚡'); markDirty(); save(); redraw(); render(); } return; }
  if(ds.dbuy){ const k = ds.dbuy, it = DSHOP[k]; if(!S.dshop || !(S.dshop[k] > 0)) return;
    if(S.coins < it.coins){ openSheet('need', {coins:it.coins}); return; }
    if(k==='chest' && !empties().length){ toast('Нет места на кухне — освободи клетку для сундука'); return; }
    let msg = '';
    if(k==='shard'){ const h = randomShardHero(); if(!h){ toast('Все герои уже собраны'); return; } addShard(h, 1); msg = '🧩 Осколок: '+HEROES[h].e+' '+hn(h); }
    S.coins -= it.coins; S.dshop[k]--; mc('shop');
    if(k==='jar'){ S.jars = (S.jars||0) + 1; msg = '🥫 +1 банка энергии'; }
    if(k==='chest'){ place({sp:'chest'}); msg = '🎁 Сундук на кухне!'; }
    haptic('ok'); toast(msg); markDirty(); save(); render(); return; }
  if(ds.wbuy){ const h = ds.wbuy; if(!S.wshop || !(S.wshop.left[h] > 0)) return;
    if(S.coins < WSHOP.coins){ openSheet('need', {coins:WSHOP.coins}); return; }
    S.coins -= WSHOP.coins; S.wshop.left[h]--; mc('shop'); addShard(h, 1); haptic('ok'); toast('🧩 Осколок: '+HEROES[h].e+' '+hn(h)); markDirty(); save(); render(); return; }
  if(ds.hair){ const [h,id] = ds.hair.split(':'); if(ownsLook(h,id)){ S.heroes[h].hair = id; S.heroes[h].look = 'auto'; markDirty(); redraw(); haptic('light'); } return; }
  if(ds.wear){ const [h,id] = ds.wear.split(':'); if(id==='auto' || ownsLook(h,id)){ S.heroes[h].look = id; markDirty(); redraw(); haptic('light'); } return; }
  if(ds.buy){ buy(ds.buy); return; }
  if(ds.go){ closeSheet(); view = ds.go; render(); return; }
  if(ds.build){ const r = REPAIRS.find(x=>x.id===ds.build); if(!r) return;
    const busyN = REPAIRS.filter(x => S.upg[x.id] && S.upg[x.id].state==='build' && now() < S.upg[x.id].end).length;
    if(busyN >= builders()){ openSheet('busy'); return; }
    if(S.coins<r.c){ openSheet('need', {coins:r.c, back:'repair'}); return; }
    S.coins -= r.c; S.upg[r.id] = {state:'build', start:now(), end:now()+Math.round(r.t*1000*(1-Math.min(.5, skill('build'))))}; mc('build'); toast('🔨 Стройка началась: '+r.n); markDirty(); save(); redraw(); render(); return; }
  if(ds.finish){ tickBuilds(); redraw(); render(); return; }
  if(ds.gen){ const c = ds.gen, gl = S.gen[c]||1; if(gl<3 && S.coins<CONFIG.GEN_COST[gl]){ openSheet('need', {coins:CONFIG.GEN_COST[gl], back:'gen'}); return; } if(gl<3 && S.coins>=CONFIG.GEN_COST[gl]){ S.coins -= CONFIG.GEN_COST[gl]; S.gen[c] = gl+1; toast(LINES[c].gen+' улучшен до ур. '+(gl+1)); markDirty(); if(kind) redraw(); render(); } return; }
  if(ds.gp){ const a = goalPick||[]; const i = a.indexOf(ds.gp); if(i>=0) a.splice(i,1); else if(a.length<3) a.push(ds.gp); goalPick = a; render(); return; }
  if(ds.goalsave!=null){ if(goalPick && goalPick.length===3){ const changing = S.goals.picked.length===3; S.goals.picked = goalPick.slice(); if(changing) S.goals.week = weekKey(now()); goalPick = null; markDirty(); render(); } return; }
  if(ds.goalchange!=null){ goalPick = S.goals.picked.slice(); render(); return; }
  if(ds.gd){ if(!S.goals.done[ds.gd] && Object.keys(S.goals.done).length<3){ S.goals.done[ds.gd] = 1; mc('goal'); const ge = CONFIG.GOAL_ENERGY + Math.floor(skill('goalE')); S.energy += ge; haptic('ok');
      let m = 'Молодец! +'+ge+' ⚡'; if(Object.keys(S.goals.done).length===3){ const j = place({sp:'chest'}); m += j>=0 ? '\n🎁 Все цели выполнены — сундук на кухне!' : '\nОсвободи место на кухне для сундука'; }
      toast(m, 3000); markDirty(); render(); } return; }
});
document.addEventListener('contextmenu', e => { if(e.target.closest('.gen')){ e.preventDefault(); } });
// long-press on generator area opens upgrades
let lp = null, lpFired = false; document.addEventListener('pointerdown', e => { const g = e.target.closest('.gen'); if(!g) return; lpFired = false; lp = setTimeout(()=>{ lpFired = true; openSheet('gen'); }, 550); });
document.addEventListener('pointerup', () => { clearTimeout(lp); lp = null; });
document.addEventListener('click', e => { if(S && e.target.closest('[data-energy]')) openSheet('energy'); });
document.addEventListener('pointercancel', () => { clearTimeout(lp); lp = null; });

/* =====================================================================
   ЗНАКОМСТВО
   ===================================================================== */
let ob = { step:0, avatar:null, name:'', hero:null, look:null, bday:null };
function onboarding(imported){
  const app = $('app');
  const suggested = imported && imported.pet ? ({trainer:'trainer',office:'office',cat:'cat',lifter:'lifter',powerlifter:'lifter',lifterf:'lifter'})[imported.pet.type] : null;
  if(suggested && !ob.hero){ ob.hero = suggested; if(FEM[suggested] && (imported.pet.sex==='f' || imported.pet.type==='lifterf')) ob.sex = 'f'; }
  if(!ob.name) ob.name = (ME.first_name||'').slice(0,20);
  let body = '';
  if(ob.step===0) body = `<div class="panel" style="text-align:center;align-items:center;justify-content:center"><div class="logo">Yard Stars</div>
      <div class="big" style="width:120px">${ic('heroes/looks/chef_a_face','👨‍🍳')}</div>
      <p style="font-size:16px;color:var(--ink)">Привет! Я Шеф. Добро пожаловать во двор!</p>
      <p>Здесь ты готовишь вкусное для соседей, отстраиваешь улицу и собираешь команду героев.</p>
      ${imported?'<p style="color:var(--ok)"><b>Твои монеты и наряды из «Береги его» уже переехали с тобой 🎉</b></p>':''}
      <button class="btn b-go" data-ob="next">Начать</button></div>`;
  else if(ob.step===1) body = `<div class="panel"><h2>Кто ты во дворе?</h2><p>Выбери свой портрет. Его увидят соседи.</p>
      <div class="grid4">${AVATARS.map(a=>`<button class="card${ob.avatar===a?' pick':''}" data-ava="${a}">${avaIc(a)}</button>`).join('')}</div>
      <label for="obName"><b style="color:var(--wood)">Как тебя зовут?</b></label><input id="obName" maxlength="20" value="${esc(ob.name)}" placeholder="Имя">
      <button class="btn b-go" data-ob="next" ${ob.avatar?'':'disabled'}>Дальше</button></div>`;
  else if(ob.step===2) body = `<div class="panel"><h2>Твой главный герой</h2><p>Выбери любого — он будет с тобой с первого дня. Остальные присоединятся позже.</p>
      ${ob.hero && FEM[ob.hero] ? `<b style="color:var(--wood)">Мужчина или женщина?</b><div class="grid2"><button class="card${ob.sex!=='f'?' pick':''}" data-obsex="m">${lookFace(ob.hero, LOOKS[ob.hero][0][0])}<b>${HEROES[ob.hero].n}</b><span>мужчина</span></button><button class="card${ob.sex==='f'?' pick':''}" data-obsex="f">${lookFace(ob.hero, FEM[ob.hero])}<b>${FEM_NAME[ob.hero]}</b><span>женщина</span></button></div>` : ''}
      <div class="grid2 g3">${HERO_IDS.map(h=>`<button class="card${ob.hero===h?' pick':''}" data-obhero="${h}">${lookFace(h, ob.hero===h && ob.sex==='f' && FEM[h] ? FEM[h] : LOOKS[h][0][0])}<b style="font-size:13px">${ob.hero===h && ob.sex==='f' && FEM[h] ? FEM_NAME[h] : HEROES[h].n}</b></button>`).join('')}</div>
      ${ob.hero ? `<p>«${esc(HEROES[ob.hero].line)}»</p>` : ''}
      ${suggested?`<p style="color:var(--ok)">Твой питомец «${esc(imported.pet.name||'')}» переехал с тобой.</p>`:''}
      <button class="btn b-go" data-ob="next" ${ob.hero?'':'disabled'}>Дальше</button></div>`;
  else if(ob.step===3) body = `<div class="panel"><h2>Когда у тебя день рождения?</h2><p>В этот день во дворе тебя ждёт подарок, которого нет ни у кого. Можно пропустить.</p>
      <div style="display:flex;gap:8px"><select id="bdD" aria-label="День"><option value="">День</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
      <select id="bdM" aria-label="Месяц"><option value="">Месяц</option>${['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
      <button class="btn b-go" data-ob="finish">Готово</button><button class="btn b-wood" data-ob="skip">Пропустить</button></div>`;
  app.innerHTML = (DEMO?'<div class="demo">Демо-режим</div>':'') + `<div class="screen">${body}</div>`;
}
document.addEventListener('click', e => {
  if(S) return; const t = e.target.closest('button'); if(!t) return; const ds = t.dataset;
  const nm = $('obName'); if(nm) ob.name = nm.value.trim().slice(0,20);
  if(ds.ava){ ob.avatar = ds.ava; onboarding(window._imp); return; }
  if(ds.obhero){ if(ob.hero!==ds.obhero){ ob.look = null; ob.sex = 'm'; } ob.hero = ds.obhero; onboarding(window._imp); return; }
  if(ds.obsex){ ob.sex = ds.obsex; onboarding(window._imp); return; }
  if(ds.ob==='next'){ ob.step++; onboarding(window._imp); return; }
  if(ds.ob==='finish' || ds.ob==='skip'){
    if(ds.ob==='finish'){ const d=$('bdD').value, m=$('bdM').value; if(d&&m) ob.bday = m+'-'+d; }
    S = newState(ob); REV = REV||0; normalize(); view='kitchen'; dirty = true; render();
    save().then(async () => { if(DEMO || !window._imp) return; const r = await api('/api/load', { tz: -new Date().getTimezoneOffset() }); if(r._status===200 && r.state){ REV = r.rev; S = r.state; SHOP = r.shop||SHOP; normalize(); render(); if(r.importedNow && !r.importedNow.pending) openSheet('welcomeBack', r.importedNow); } });
    setTimeout(()=>toast(TUT[0], 3600), 600);
  }
});

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
function birthdayCheck(){
  const b = S.owner && S.owner.bday; if(!b) return;
  const d = new Date(now()), key = (d.getMonth()+1)+'-'+d.getDate();
  if(b===key && S.bdayYear !== d.getFullYear()){ S.bdayYear = d.getFullYear(); S.coins += 100;
    S.wardrobe.owned = [...new Set([...(S.wardrobe.owned||[]), 'hat:bday'+d.getFullYear()])]; WEAR_NAMES['hat:bday'+d.getFullYear()] = 'Праздничная корона '+d.getFullYear();
    markDirty(); setTimeout(()=>toast('🎂 С днём рождения, '+(S.owner.name||'сосед')+'!\nПодарок: 100 🪙 и праздничная корона, которой нет ни у кого', 5000), 800); }
}
let lastE = null, dayNow = null;
async function reloadState(){ if(DEMO) return; await save(); const l = await api('/api/load', { tz: -new Date().getTimezoneOffset() }); if(l._status===200 && l.state){ REV = l.rev; S = l.state; SHOP = l.shop||SHOP; normalize(); render(); if(kind) redraw(); if(l.jarGift) toast('🥫 Новый день: '+l.jarGift+' банки энергии в подарок!'); } }
async function boot(){
  if(TG){ try{ TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#3a2414'); TG.setBackgroundColor && TG.setBackgroundColor('#1f5c57'); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); }catch(e){} }
  if(DEMO){
    try{ S = JSON.parse(localStorage.getItem('ys-demo')||'null'); }catch(e){ S = null; }
    ME = { first_name:'' };
    if(S){ normalize(); render(); } else onboarding(null);
  } else {
    let r; try{ r = await api('/api/load', { tz: -new Date().getTimezoneOffset() }); }catch(e){ r = {}; }
    if(!r || r._status!==200){ $('app').innerHTML = `<div class="center"><div><div class="logo">Yard Stars</div><p>Не получилось связаться с двором. Проверь интернет и открой игру заново.</p><button class="btn b-go" onclick="location.reload()">Ещё раз</button></div></div>`; return; }
    offset = r.now - Date.now(); REV = r.rev; SHOP = r.shop||[]; ME = r.user||{}; IS_ADMIN = !!r.isAdmin;
    window._imp = r.importedNow;
    if(r.state) setTimeout(helpNeighbour, 1500);
    if(r.state){ S = r.state; normalize(); render(); if(r.importedNow && !r.importedNow.pending) openSheet('welcomeBack', r.importedNow); else if(r.jarGift) setTimeout(() => toast('🥫 Подарок дня: '+r.jarGift+' банки энергии!\nОни в запасе — нажми на ⚡ наверху'), 900); }
    else onboarding(r.importedNow);
  }
  if(S) birthdayCheck();
  setInterval(() => { if(!S) return; tickEnergy(); tickBuilds();
    if(view==='kitchen' && !drag){ const en=$('en'), et=$('enT'); if(en) en.textContent=S.energy; if(et) et.textContent = S.energy<CONFIG.ENERGY_MAX ? fmtTime((regenMs()-(now()-S.eTs)%regenMs())/1000) : ''; }
    document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = fmtTime(Math.max(0,(+el.dataset.cd-now())/1000)); });
    document.querySelectorAll('[data-cd2]').forEach(el => { el.textContent = fmtClock((+el.dataset.cd2-now())/1000); });
    if(kind==='energy' && S.energy !== lastE) redraw(); lastE = S.energy;
    const dk = misDay(); if(dayNow === null) dayNow = dk; else if(dk !== dayNow){ dayNow = dk; reloadState(); }
  }, 1000);
  window.addEventListener('resize', sizeBoard);
  try{ TG && TG.onEvent && TG.onEvent('viewportChanged', () => setTimeout(sizeBoard, 50)); }catch(e){}
}
boot();
</script>
