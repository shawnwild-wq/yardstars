<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Береги его</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one pocket device (rounded pager shell) on a slate page; dot-matrix LCD on top, toy buttons below. Single deliberate look. */
:root{
  --page:#2b3a55; --page-2:#22304a;
  --shell:#f0b429; --shell-edge:#c98a10; --shell-ink:#5a3d00;
  --lcd:#fffaf0; --lcd-shade:#f1e8d6; --ink:#2a2a2a; --ink-soft:#8a8274;
  --btn:#fff6dd; --btn-ink:#3a2a05; --danger:#c43c35;
  --f-display:"Rubik Mono One","Arial Black",sans-serif;
  --f-body:"Rubik",system-ui,sans-serif;
  --f-lcd:"PT Mono",ui-monospace,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--page),var(--page-2));color:var(--btn);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
*{box-sizing:border-box}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;color:var(--shell);text-align:center;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-size:13px;letter-spacing:0;color:#c9d3e6;margin-top:6px;font-weight:400}
.device{background:var(--shell);border-radius:34px;padding:18px 16px 20px;box-shadow:inset 0 -6px 0 var(--shell-edge),0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.screen{background:var(--lcd);border-radius:18px;border:5px solid var(--shell-ink);padding:10px;color:var(--ink);font-family:var(--f-body);
  display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.top b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top span{flex-shrink:0}
.scene svg{width:100%;height:auto;display:block;border-radius:10px;border:2.5px solid var(--ink)}
.sub{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:-4px}
.sub b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--lcd-shade);overflow:hidden;flex-basis:100%}
.bar span{display:block;height:100%;background:#f0b429}
.snd+.snd{margin-left:6px}
.statmore{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:10px;border-top:1px dashed #cfc6b2;padding-top:6px}.statmore .link{background:none;border:0;padding:6px 0;font:500 13px Rubik,system-ui,sans-serif;color:var(--ink-soft);text-decoration:underline;cursor:pointer}
.cfm{position:fixed;inset:0;background:rgba(20,26,40,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.cfmbox{background:#fffaf0;border:2.5px solid #2a2a2a;border-radius:14px;padding:16px;max-width:340px;font:15px/1.4 Rubik,system-ui,sans-serif;white-space:pre-line}.cfmbox div{display:flex;gap:8px;margin-top:12px}.cfmbox button{flex:1;font:700 14px Rubik,system-ui,sans-serif;border:0;border-radius:10px;padding:11px}.cfmbox .ok{background:#2a2a2a;color:#fff}.cfmbox .no{background:#e3ddd0}
.hwb{border-color:#e8822a;color:#7a3c00;background:#ffe2c4;font-weight:700;cursor:default}
.hwglow{animation:hwg 1.6s ease-in-out infinite}
.rain{animation:rainf .5s linear infinite}@keyframes rainf{from{transform:translate(0,0)}to{transform:translate(-4px,10px)}}@keyframes hwg{0%,100%{opacity:.25}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.hwglow{animation:none}}
#styleBtn{white-space:nowrap;border-color:#c98a10;color:#5a3d00;background:#fff3c4}
.snd{white-space:nowrap;flex-shrink:0;margin-left:auto;background:none;border:1.5px solid var(--ink-soft);border-radius:999px;font:inherit;font-size:12px;color:var(--ink-soft);padding:2px 10px;cursor:pointer}
.evo{background:#fff3c4;border:2.5px solid var(--ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
.evo b{font-size:16px}
.evo button{align-self:flex-start;font-family:var(--f-body);font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.scenewrap{position:relative}
.scene{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pan{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;border-radius:12px;border:2.5px solid var(--ink);background:rgba(255,250,240,.9);font-size:26px;line-height:1;font-weight:700;color:var(--ink);cursor:pointer;padding:0 0 4px}
.pan.l{left:6px}.pan.r{right:6px}
.pan.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,60%,100%{transform:translateY(-50%)}70%{transform:translate(5px,-50%)}80%{transform:translateY(-50%)}90%{transform:translate(5px,-50%)}}
.spot{cursor:pointer}
.peek{animation:peek 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes peek{0%,88%,100%{transform:none}91%{transform:rotate(-1.5deg)}94%{transform:rotate(1.5deg)}97%{transform:rotate(-1deg)}}
.popwrap{position:relative;height:0}
.pop{position:absolute;left:50%;bottom:60px;font-size:28px;color:#e8584f;font-weight:700;animation:pop 1.2s ease-out forwards;pointer-events:none;text-shadow:0 0 2px #fff}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
.hop{animation:hop .42s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-5px)}}
.eyes{animation:blinkE 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blinkE{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.jig{animation:jig .42s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes jig{to{transform:scaleX(1.05) scaleY(.97)}}
.zz{animation:zz 2.4s ease-in infinite}
.wag{animation:wag .35s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes zz{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-12px);opacity:0}}
.stink{animation:stink 1s ease-in-out infinite alternate}
@keyframes stink{from{opacity:.25}to{opacity:1}}
.spark{animation:spark .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes spark{to{opacity:.2}}
.pan:focus-visible{outline:3px solid #fff;outline-offset:2px}
.x{}
@media (prefers-reduced-motion:reduce){.wag{animation:none}.pan.nudge,.peek,.hop,.eyes,.jig,.zz,.stink,.spark{animation:none}}
.attn{display:flex;align-items:center;gap:8px;font-size:13px;min-height:22px}
.attn i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;border-radius:7px;font-weight:700;font-size:15px;flex-shrink:0}
.attn i svg{width:16px;height:16px}
.attn.need i{background:#c43c35;color:#fff;animation:blink .8s steps(1) infinite}
.attn.riddle i{background:#7a5cc4;color:#fff;animation:blink .8s steps(1) infinite}
.attn.sleep i{background:#33427a}
.attn.ok i{background:#ffe08a}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.attn i{animation:none!important}}
.say{min-height:40px;font-size:14px;line-height:1.35;border-top:2px dashed var(--ink-soft);padding-top:8px}
.stat{font-size:14px;line-height:1.7;padding:4px 2px}
.stat .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--ink-soft)}
.stat .row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.hearts{letter-spacing:2px}
.hint2{font-size:12px;color:var(--ink-soft);line-height:1.4;margin-top:8px}
.mg{display:flex;flex-direction:column;gap:10px;font-size:14px}
.mgquit{align-self:center;background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-family:var(--f-body);font-size:13px;padding:10px 6px;margin-top:6px;cursor:pointer}
.mg h3{margin:0;font-size:15px;display:flex;justify-content:space-between}
.mg .q{font-size:15px;line-height:1.4;min-height:44px}
.meter{position:relative;height:30px;border:3px solid var(--ink);border-radius:4px}
.meter .zone{position:absolute;top:0;bottom:0;left:38%;width:24%;background:var(--lcd-shade);border-left:2px dashed var(--ink);border-right:2px dashed var(--ink)}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:6px;background:var(--ink);left:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{aspect-ratio:1;min-height:64px;border:3px solid var(--ink);background:transparent;border-radius:6px;cursor:pointer;font-size:22px;color:var(--ink);font-family:var(--f-body)}
.lcdbtns{display:flex;gap:8px;flex-wrap:wrap}
.cfield{position:relative;height:230px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff6e4;touch-action:none}
.cfield .it{position:absolute;top:-40px;font-size:30px;line-height:1;cursor:pointer;user-select:none;padding:4px}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pairs button{aspect-ratio:1;font-size:30px;border:3px solid var(--ink);border-radius:10px;background:var(--ink);cursor:pointer}.pairs button.up{background:#fffaf0}.pairs button.ok{background:#dff3d6}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:0 auto}.ttt button{aspect-ratio:1;font:700 34px Rubik,sans-serif;border:3px solid var(--ink);border-radius:10px;background:#fffaf0;cursor:pointer;color:var(--ink)}
.lcdbtns button,.lcdbtn{flex:1 1 120px;font-family:var(--f-body);font-weight:700;background:var(--ink);color:var(--lcd);border:0;border-radius:12px;padding:12px 10px;font-size:15px;cursor:pointer}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{font-family:var(--f-body);font-weight:700;font-size:14px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:16px;padding:10px 6px;cursor:pointer;
  box-shadow:0 4px 0 var(--shell-edge);text-align:center;line-height:1.2;min-height:52px;min-width:0;overflow-wrap:anywhere}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shell-edge)}
.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}
.btn.wide{grid-column:1/-1;background:var(--shell-ink);color:var(--shell);box-shadow:0 4px 0 #3a2700}
.btn.half{grid-column:span 1}
.btn:focus-visible,.lcdbtns button:focus-visible,.lcdbtn:focus-visible,.grid3 button:focus-visible,.pick:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sexrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sexbtn{font-family:var(--f-body);font-weight:700;font-size:15px;background:var(--btn);color:var(--btn-ink);border:4px solid transparent;border-radius:14px;padding:10px;cursor:pointer}
.sexbtn[aria-pressed="true"]{border-color:var(--shell-ink);background:#ffe9a8}
.style{display:flex;flex-direction:column;gap:10px;font-size:14px}
.style .bal{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.coin{display:inline-flex;align-items:center;gap:5px}
.coin i{width:14px;height:14px;border-radius:50%;background:#f2c14e;border:2px solid #c98a10;display:inline-block}
.style .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.style .tabs::-webkit-scrollbar{display:none}
.style .tabs button{flex:0 0 auto}
.style .tabs button,.style .topup{font-family:var(--f-body);font-weight:700;font-size:13px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.style .tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.style .pv{background:#f3ecdc;border-radius:12px;border:2.5px solid var(--ink)}
.style .pv svg{width:100%;height:170px;display:block}
.style .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.style .opts button{font-family:var(--f-body);font-size:13px;border:2.5px solid var(--lcd-shade);background:#fff;color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;line-height:1.25}
.style .opts button[aria-pressed="true"]{border-color:var(--ink);background:#fff3c4}
.style .opts small{display:block;color:var(--ink-soft);font-size:11px}
.style .note{font-size:13px;color:var(--ink-soft);line-height:1.4}
.ctoast{background:#fff3c4;border:2px solid #c98a10;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:#5a3d00}
.tasknote{grid-column:1/-1;background:#efe6fb;color:#3a2a5c;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.35}
.namebox{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;background:var(--btn);border-radius:16px;padding:12px}
.namebox label{font-weight:700;color:var(--btn-ink);font-size:14px}
.namebox input{font-family:var(--f-body);font-size:17px;padding:10px;border-radius:10px;border:3px solid var(--shell-ink);background:#fff;color:var(--btn-ink)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{background:var(--lcd);border:4px solid transparent;border-radius:14px;padding:6px 6px 10px;cursor:pointer;color:var(--ink);font-family:var(--f-body);font-size:13px;text-align:center}
.pick svg{width:100%;height:110px;display:block}
.pick[aria-pressed="true"]{border-color:var(--shell-ink);background:var(--lcd-shade)}
.pick b{display:block;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;color:var(--shell-ink);font-weight:700;font-size:14px}
input#petName{font-family:var(--f-body);font-size:17px;padding:12px;border-radius:12px;border:4px solid var(--shell-ink);background:var(--btn);color:var(--btn-ink);width:100%}
.hint{color:var(--shell-ink);font-size:13px;line-height:1.4}
.panel{background:rgba(255,255,255,.06);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--f-display);font-size:14px;margin:0;color:var(--shell);letter-spacing:.03em}
.graves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:#dbe3f0}
.graves li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:6px}
.graves li span:first-child{min-width:0}
.graves li span:last-child{text-align:right;color:#aab6cc;font-variant-numeric:tabular-nums;flex-shrink:0}
.rec{font-size:14px;color:#dbe3f0}
.rec b{color:var(--shell)}
.epitaph{text-align:center;font-size:15px;line-height:1.5}
.epitaph b{font-size:18px}
.err{color:var(--danger);font-weight:700;font-size:13px;min-height:16px}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">Береги его<small>Заботься вовремя. Умрёт — не вернёшь.</small></div>

  <section id="vChoose" class="device" hidden>
    <div class="hint">Выбери, о ком будешь заботиться. Первый час малыш зовёт часто. Время идёт по-настоящему, даже когда игра закрыта.</div>
    <div class="sexrow" id="sexRow" role="group" aria-label="Пол"><button type="button" class="sexbtn" data-sex="m"></button><button type="button" class="sexbtn" data-sex="f"></button></div>
    <div class="sexrow" id="lookRow" role="group" aria-label="Внешность" hidden><button type="button" class="sexbtn lookbtn" data-look="hair">С волосами</button><button type="button" class="sexbtn lookbtn" data-look="bald">Лысый с бородой</button></div>
    <div class="picks" id="picks"></div>
    <label class="f" for="petName"><span id="nameLbl">Как его зовут?</span>
      <input id="petName" maxlength="18" placeholder="Например, Гена" autocomplete="off">
    </label>
    <div class="err" id="err"></div>
    <button class="btn wide" id="startBtn">Начать жизнь</button>
  </section>

  <section id="vGame" class="device" hidden>
    <div class="screen">
      <div class="top"><b id="gName"></b><span id="gStage"></span></div>
      <div class="sub" id="gSub"></div>
      <div class="attn" id="attn"><i id="attnIcon"></i><span id="attnText"></span><span class="snd hwb" id="hwBadge" hidden></span><button class="snd" id="styleBtn" type="button"></button><button class="snd" id="sndBtn" type="button"></button></div>
      <div class="evo" id="evo" hidden></div>
      <div class="scenewrap"><div class="scene" id="scene"></div></div><div class="popwrap" id="popwrap" aria-hidden="true"></div>
      <div class="stat" id="statView" hidden></div>
      <div class="style" id="styleView" hidden></div>
      <div class="ctoast" id="ctoast" hidden></div>
      <div class="mg" id="mgView" hidden></div>
      <div class="say" id="say"></div>
    </div>
    <div class="actions" id="actions"></div>
  </section>

  <section id="vDead" class="device" hidden>
    <div class="screen">
      <div class="scene" id="graveScene"></div>
      <div class="epitaph" id="epitaph"></div>
      <div class="evo" id="offer" hidden></div>
    </div>
    <button class="btn wide" id="newBtn">Завести нового</button>
  </section>

  <section class="panel" id="memorial" hidden>
    <div id="hall" hidden></div>
    <h2>Кладбище</h2>
    <div class="rec" id="record"></div>
    <ul class="graves" id="graves"></ul>
  </section>
</div>

<script>

  const RO=styleTab==='role', SET=styleTab==='hw'||styleTab==='pjt'||styleTab==='room'||RO, HW=styleTab==='hw', PJ=styleTab==='pjt', RM=styleTab==='room';
  if(styleSel==null) styleSel=SET?(styleOpts(p,styleTab)[0]||[''])[0]:(p.look||{})[styleTab]||'default';
  const hsl=SET?styleSel.split(':'):null;
  let look=RO&&hsl[0]==='off'?roleOff(p.look,p):SET?(hsl[0]==='none'?Object.assign({},p.look||{}):wearOn(p.look,hsl[0],hsl[1])):wearOn(p.look,styleTab,styleSel);
  if(PJ&&styleSel==='none:none'){ look=Object.assign({},p.look||{}); Object.keys(look).forEach(k=>{ if(k.startsWith('pjt_')) delete look[k]; }); }
  const vb=CH[p.type].human?'-85 -178 170 184':'-80 -150 175 156';
  const m=p.sick?'sick':'happy';
  $('styleView').innerHTML=`<div class="bal"><span class="coin"><i></i>${S.coins||0} ${coinWord(S.coins||0)}${HW?' · 🎃 '+(S.pumpkins||0):''}</span><button class="topup" id="topup" type="button">Пополнить</button></div>
    <div class="tabs">${styleTabs(p).map(([k,t])=>`<button type="button" data-tab="${k}" aria-pressed="${k===styleTab}">${t}</button>`).join('')}</div>
    <div class="pv">${RM?(()=>{ const [a,b]=styleSel.split(':'); roomPreview=a==='reset'?{}:Object.assign({},S.room||{},{[a]:b}); const sv=sceneSVG(p,'happy',fatLevel(p),false).replace(/viewBox="[^"]*"/,'viewBox="0 0 960 220"'); roomPreview=null; return sv; })():`<svg viewBox="${vb}" aria-label="Примерка">${charSVG(p.type,p.stage,p.stage==='teen'?p.teenForm:p.form,m,fatLevel(p),p.sex,p.breed,look)}</svg>`}</div>
    <div class="opts">${styleOpts(p,styleTab).map(([k,t])=>`<button type="button" data-opt="${k}" aria-pressed="${k===styleSel}">${t}<small>${SET?(()=>{const [a,b]=k.split(':'); if(a==='none'||a==='reset'||a==='off') return '&nbsp;'; if(RO) return (p.look||{})[a]===b?'сейчас':'бесплатно'; if(RM) return (S.room||{})[a]===b?'сейчас':owns('room_'+a,b)?'твоё':ROOM_ITEMS.find(x=>x[0]===a&&x[1]===b)[3]+' мон.'; const it=setItems(p,styleTab).find(x=>x[0]===a&&x[1]===b); return (p.look||{})[a]===b?'сейчас':owns(a,b)?'твоё':it[3]+(HW?' 🎃':' мон.');})():k===((p.look||{})[styleTab]||'default')?'сейчас':k==='default'||owns(styleTab,k)?'твоё':priceOf(styleTab,k)+' мон.'}</small></button>`).join('')}</div>
    <div class="note">${styleNote||(RO?'Форма твоей новой профессии — бесплатно. Надевай, если хочешь, чтобы было видно, кем он стал.':RM?'Комната общая для всех твоих питомцев. Купленное остаётся навсегда, менять обратно бесплатно.':PJ?'Экипировка фирмы ПЖТ — только для лифтёра. Можно надеть всё сразу: трико, пояс, бинты и обувь. Купленное остаётся навсегда.':HW?'Костюмы за тыквы 🎃 продаются только до 1 ноября, а купленные остаются навсегда. Не хватает тыкв — можно за монеты: 1 тыква = 2 монеты.':'Примерка бесплатная. Купленная вещь остаётся у тебя навсегда, даже у следующих питомцев, и переодевать её бесплатно.')}</div>`;
  $('styleView').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{styleTab=b.dataset.tab;styleSel=null;styleNote='';sfx('click');render();});
  $('styleView').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{styleSel=b.dataset.opt;styleNote='';sfx('click');render();});
  $('topup').onclick=()=>{sfx('click');buyCoins();};
}
function act(a){
  simulate(); const p=S.pet; if(!p){render();return;} p.msgRaw=false;
  if(a==='style'){ view=view==='style'?'main':'style'; styleTab=null; styleSel=null; styleNote=''; sfx('click'); render(); return; }
  if(a==='applyStyle'&&styleTab==='hw'){ const [sl,k]=styleSel.split(':'), it=hwItems(p).find(x=>x[0]===sl&&x[1]===k); if(!it) return;
    const pr=it[3]; if(!owns(sl,k)){ if((S.pumpkins||0)>=pr) S.pumpkins-=pr; else if((S.coins||0)>=pr*2) S.coins-=pr*2; else { styleNote='Не хватает: нужно '+pr+' 🎃 (у тебя '+(S.pumpkins||0)+') или '+pr*2+' монет.'; sfx('no'); render(); return; }
      S.owned=(S.owned||[]).concat([sl+':'+k]); styleNote='Куплено: '+it[2]+'! Теперь это твоё навсегда.'; } else styleNote='Надето!';
    p.look=wearOn(p.look,sl,k); p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; save(); render(); return; }
  if(a==='applyStyle'&&styleTab==='role'){ const [sl,k]=styleSel.split(':'); p.look=sl==='off'?roleOff(p.look,p):wearOn(p.look,sl,k); styleNote=sl==='off'?'Форма снята.':'Надето!'; p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; save(); render(); return; }
  if(a==='applyStyle'&&styleTab==='room'){ const [sl,k]=styleSel.split(':');
    if(sl==='reset'){ S.room={}; styleNote='Комната как была.'; save(); render(); return; }
    const it=ROOM_ITEMS.find(x=>x[0]===sl&&x[1]===k); if(!it) return; const pr=it[3];
    if(!owns('room_'+sl,k)){ if((S.coins||0)<pr){ styleNote='Не хватает монет: нужно '+pr+', у тебя '+(S.coins||0)+'.'; sfx('no'); render(); return; } S.coins-=pr; S.owned=(S.owned||[]).concat(['room_'+sl+':'+k]); styleNote='Куплено: '+it[2]+'!'; } else styleNote='Готово!';
    S.room=Object.assign({},S.room||{},{[sl]:k}); sfx('happy'); save(); render(); return; }
  if(a==='applyStyle'&&styleTab==='pjt'){ const [sl,k]=styleSel.split(':');
    if(sl==='none'){ const L=Object.assign({},p.look||{}); Object.keys(L).forEach(x=>{ if(x.startsWith('pjt_')) delete L[x]; }); p.look=L; styleNote='Экипировка снята.'; save(); render(); return; }
    const it=pjtItems(p).find(x=>x[0]===sl&&x[1]===k); if(!it) return; const pr=it[3];
    if(!owns(sl,k)){ if((S.coins||0)<pr){ styleNote='Не хватает монет: нужно '+pr+', у тебя '+(S.coins||0)+'.'; sfx('no'); render(); return; } S.coins-=pr; S.owned=(S.owned||[]).concat([sl+':'+k]); styleNote='Куплено: '+it[2]+'! Теперь это твоё навсегда.'; } else styleNote='Надето!';
    p.look=wearOn(p.look,sl,k); p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; save(); render(); return; }
  if(a==='applyStyle'){ const pr=priceOf(styleTab,styleSel), free=styleSel==='default'||owns(styleTab,styleSel);
    if(!free&&(S.coins||0)<pr){ styleNote='Не хватает монет: нужно '+pr+', у тебя '+(S.coins||0)+'.'; sfx('no'); render(); return; }
    if(!free){ S.coins-=pr; S.owned=(S.owned||[]).concat([styleTab+':'+styleSel]); }
    p.look=wearOn(p.look,styleTab,styleSel); styleNote=free?'Надето! Это уже твоё, бесплатно.':'Куплено навсегда! Списано '+pr+' '+coinWord(pr)+'. Теперь переодевать бесплатно.'; p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; save(); render(); return; }
  if(p.vac&&!['status','back','style','applyStyle'].includes(a)){ p.msg='Он в отпуске на море до '+new Date(p.vac.until).toTimeString().slice(0,5)+' 🏖'; p.msgRaw=true; render(); return; }
  if(p.dormant&&a!=='status'&&a!=='back'){ if(a==='food'||a==='meal'){ p.dormant=false; p.stats.health=60; p.stats.hunger=60; p.stats.happy=40; p.lastTick=Date.now(); p.msg='Проснулся! Он так ждал тебя 🥺'; p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; sfx('happy'); view='main'; }
    else { p.msg='Он спит и ждёт тебя. Покорми его, чтобы разбудить.'; sfx('no'); } save(); render(); return; }
  if(a==='bed'){ if((S.beds||0)>0){ S.beds--; p.onBed=true; walkX=872; panTo(872-VIEW/2); p.msg='Уложил на кровать. Утром у него будет отличное настроение ☀️ Осталось ночей: '+S.beds+'.'; sfx('happy'); save(); render(); }
    else pay('bed',null,t=>{ p.msg=t; render(); }); return; }
  if(a==='eternal'){ if(!S.eternalUsed&&!p.eternal) pay('eternal',null,t=>{ p.msg=t; render(); }); return; }
  if(a==='hall'){ if(p.eternal){ S.hall=p; p.hallAt=Date.now(); S.pet=null; view='main'; save(); render(); } return; }
  const s=p.stats, c=CH[p.type], cr=CH[RL(p)];
  const prevMsg=p.msg, prevHunger=s.hunger, prevDisc=s.disc;
  if(!['meal','snack','scold','play'].includes(a)) sfx('click');
  setTimeout(()=>{ if(!S.pet) return; if(a==='meal'&&S.pet.stats.hunger>prevHunger) sfx('eat');
    else if((a==='meal'||a==='play')&&S.pet.msg!==prevMsg&&!mg) sfx('no');
    if(a==='scold') sfx(S.pet.stats.disc>prevDisc?'scold':'no');
    if(a==='snack') sfx('eat');
    if(a==='play'&&mg) sfx('click'); },0);
  if(a==='status'){view=view==='status'?'main':'status'; statSub='main'; render();return;}
  if(a.startsWith('g_')){ view='main'; const m=a.slice(2); if(m==='own') startGame(p); else startMini(p,m); save(); render(); return; }
  if(a==='tot'){ view='tot'; render(); return; }
  if(a==='totYes'||a==='totNo'){ const T=totInfo(p,Date.now()); view='main'; if(!T) { render(); return; } S.tot=T.key;
    if(a==='totYes'){ s.happy=clamp(s.happy+25); S.pumpkins=(S.pumpkins||0)+3; p.msg='За дверью дети в костюмах: «Сладость или гадость!» Угостили их конфетами 🍬 Они оставили в подарок 3 тыквы 🎃'; p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; sfx('happy'); }
    else { s.happy=clamp(s.happy-10); p.msg='Не открыли. Дети обиделись и нарисовали на двери мелом рожицу 😅'; }
    p.msgRaw=true; save(); render(); return; }
  if(a==='event'){ if(p.evOpen&&!p.asleep){ startEvent(p); save(); render(); } return; }
  if(a==='meet'){ if(p.meetOpen&&!p.asleep){ startMeet(p); render(); } return; }
  if(a==='back'){view='main';styleNote='';render();return;}
  if(a==='food'){ if(p.asleep){p.msg='Спит. Еда подождёт.';} else view='food'; render();return; }
  if(a==='light'){
    p.light=!p.light; if(!p.light&&p.asleep) resolveEv(p,'nap');
    p.msg=p.light?(p.asleep?'Свет включён. Ему мешает спать!':'Свет включён.'):(p.asleep?'Свет выключен. Спокойной ночи.':'Темно. Он не спит и немного боится.');
  }
  else if(p.asleep && a!=='clean' && a!=='heal'){p.msg='Тсс, он спит.';}
  else if(a==='meal'){
    view='main';
    if(caprice(p)) p.msg=capriceMsg(p,'Капризничает и отворачивается.');
    else if(s.hunger>=100) p.msg='Не хочет. Уже наелся.';
    else if(s.happy<=0&&Math.random()<.4) p.msg='Хандрит и не хочет есть…';
    else {s.hunger=clamp(s.hunger+25);p.extra+=c.w.meal;p.msg=pick(cr.eat)+spoil(p);p.pop=(p.pop||0)+1;p.reactUntil=Date.now()+2500;if(s.hunger>40)resolveEv(p,'hungry');}
  }
  else if(a==='snack'){
    view='main';
    s.happy=clamp(s.happy+25);p.extra+=c.w.snack;p.msg=pick(cr.treat)+spoil(p);p.pop=(p.pop||0)+1;p.reactUntil=Date.now()+2500;if(s.happy>40)resolveEv(p,'bored');
    if(p.extra/c.fatDiv>=4&&Math.random()<.2){sicken(p,Date.now(),1);p.msg='Переел сладкого и заболел.';}
  }
  else if(a==='clean'){
    if(!p.poop) p.msg='Тут и так чисто.'; else {p.poop=0;p.messX=[];p.msg=cr.cleaned;resolveEv(p,'poop');}
  }
  else if(a==='heal'){
    if(!p.sick&&p.stats.health<60){ p.stats.health=clamp(p.stats.health+30); p.msg='Дал витамины. Ему заметно лучше.'; p.pop=(p.pop||0)+1; p.reactUntil=Date.now()+2500; }
    else if(!p.sick) p.msg='Он здоров и не хочет таблетку.';
    else {p.doses--; if(p.doses<=0){p.sick=false;p.sickSince=null;p.msg='Выздоровел!';resolveEv(p,'sick');} else p.msg='Полегчало. Нужна ещё одна доза.';}
  }
  else if(a==='scold'){
    if(p.call){p.call=null;s.disc=clamp(s.disc+25);p.msg='Перестал капризничать. Стал послушнее.';resolveEv(p,'caprice');}
    else {s.happy=clamp(s.happy-25);p.msg='Обиделся. За что?';}
  }
  else if(a==='play'){
    if(p.sick) p.msg='Болеет, не до игр.';
    else if(caprice(p)) p.msg=capriceMsg(p,'Не хочет играть. Капризничает.');
    else { const extra=spoil(p); view='games'; if(extra) p.msg=extra.trim(); save(); render(); return; }
  }
  save(); render();
}

  $('graves').innerHTML=S.graves.slice(0,10).map(g=>`<li><span>${esc(g.name)}, ${esc((g.title||CH[g.type].title).toLowerCase())}${g.revLife?' (2-я жизнь)':''}${g.revived?' → возрождён':''}</span><span>${dur(g.lived)}, ${g.cause==='отпущен'?fem('отпущен',g.sex):g.cause==='старости'?'от старости':'от '+g.cause}</span></li>`).join('');
}

$('startBtn').onclick=()=>{
  const name=$('petName').value.trim();
  if(!name){$('err').textContent=chosenSex==='f'?'Дай ей имя. Без имени заботиться не получится.':'Дай ему имя. Без имени заботиться не получится.';$('petName').focus();return;}
  $('err').textContent='';
  const now=Date.now();
  S.pet={pid:String(now),type:chosen,breed:CH[chosen].human?null:pickBreed(chosen),sex:chosenSex,name,born:now,lastTick:now,lifespan:rnd(14,21)*DAY,stage:'baby',form:null,evolvedAt:0,
    stats:{hunger:50,happy:50,disc:0,health:100},extra:0,wv:3,poop:0,sick:false,doses:0,light:true,asleep:false,
    sleptAt:0,lightPenalized:false,call:null,nextPoop:now+6*MIN,nextCall:now+4*MIN,mistakes:0,z_hunger:null,z_happy:null,
    msg:chosenSex==='f'?'Привет! Я маленькая и голодная. Покорми меня.':'Привет! Я маленький и голодный. Покорми меня.'};
  if(chosenLook==='bald'&&CH[chosen].human&&chosen!=='alpha'&&chosenSex==='m'){ S.pet.look={hair:'bald',beard:'full'}; S.owned=(S.owned||[]).concat(['hair:bald','beard:full'].filter(x=>!(S.owned||[]).includes(x))); }
  if(S.pet.breed) S.pet.msg=(chosen==='dog'?'Тебе достался щенок: ':chosen==='hamster'?'Тебе достался хомячонок: ':'Тебе достался котёнок: ')+breedOf(chosen,S.pet.breed).name+'. '+S.pet.msg;
  $('petName').value=''; view='main';
  save(); render();
};
$('newBtn').onclick=()=>{ if(S.lastDead) S.lastDead.offerDone=true; S.lastDead=null;save();render();};

load(); migrate(); setupPan(); render();
let openedAt=Date.now(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) openedAt=Date.now(); });
setInterval(()=>{frame++; if(S.pet){ simulate(); if(!S.pet){render();return;}
  { const p=S.pet; if(hwOn(Date.now())&&!mg&&!p.outside&&!p.asleep&&view==='main'&&Date.now()-openedAt>60000){ const H=hunt(p), left=H.spots.filter(k=>!H.found.includes(k)); if(left.length&&!H.hinted){ H.hinted=true; p.msg='Кажется, '+HUNT_PLACE[left[0]]+' что-то светится 👀'; p.msgRaw=true; save(); render(); } } } if(frame%5===0) render(); drawPet(frame%2===0); } titleTick(); },1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); petToView(S.pet); } syncNow(document.hidden); });
window.addEventListener('pagehide',()=>syncNow(true));
setInterval(()=>{ if(!document.hidden) syncNow(false); },120000);
setTimeout(()=>syncNow(false),1500);
setTimeout(claim,800);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) claim(); });

/* ===== переезд в Yard Stars: тихо отправляем монеты и наряды на новый сервер ===== */
const YS_API='https://yardstars.shawnwild.workers.dev', YS_BOT='https://t.me/YardStarsGameBot', YS_BANNER=true;
function ysExport(){ const init=tgInit(); if(!init) return; const p=S.pet||S.lastDead;
  try{ fetch(YS_API+'/api/import',{method:'POST',headers:{'content-type':'application/json'},keepalive:true,
    body:JSON.stringify({initData:init,data:{coins:S.coins||0,owned:S.owned||[],pet:p?{type:p.type,name:p.name,sex:p.sex}:null}})}).catch(()=>{}); }catch(e){} }
setTimeout(ysExport,2500);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) ysExport(); });
if(YS_BANNER){
  const b=document.createElement('div');
  b.style.cssText='position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9999;background:#3a2414;color:#fff6e5;border:3px solid #f2c94c;border-radius:16px;padding:12px 14px;font:600 14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.35)';
  b.innerHTML='<b style="font-size:16px">🎉 Игра переехала и стала лучше!</b><span>Теперь это Yard Stars: уютный двор, кухня и герои. Никто не умирает. Все твои монеты и наряды уже ждут тебя там + подарок.</span><button style="background:#4caf50;color:#fff;border:0;border-bottom:4px solid #2e7d32;border-radius:12px;padding:10px;font:800 15px system-ui,sans-serif">Открыть Yard Stars ▶️</button>';
  b.querySelector('button').onclick=()=>{ ysExport(); const T=window.Telegram&&Telegram.WebApp; try{ if(T&&T.openTelegramLink){ T.openTelegramLink(YS_BOT); return; } }catch(e){} location.href=YS_BOT; };
  document.body.appendChild(b);
}
})();
</script>
